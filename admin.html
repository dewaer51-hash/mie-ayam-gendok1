<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin — Mie Ayam Gendok</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/auth.js" data-guard="admin"></script>
<style>
  body { background: #f7f3ec; }
  .adm-top { background: var(--white); border-bottom: 1px solid var(--border); }
  .adm-top .wrap { display:flex; align-items:center; justify-content:space-between; height:70px; }
  .adm-badge { background: var(--red-soft); color: var(--red); font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px; margin-left:8px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:28px 0; }
  .stat { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px 20px; }
  .stat .label { color:var(--gray); font-size:.82rem; }
  .stat .value { font-family:'Poppins',sans-serif; font-weight:700; font-size:1.6rem; margin-top:4px; }
  .stat.alert .value { color: var(--red); }
  .toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .toolbar input, .toolbar select { padding:10px 14px; border:1px solid var(--border); border-radius:999px; font-family:inherit; font-size:.9rem; background:var(--white); }
  .toolbar input { flex:1; min-width:200px; }
  .order-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px 22px; margin-bottom:14px; }
  .order-card.baru { border-left:4px solid var(--red); }
  .order-head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .order-meta { color:var(--gray); font-size:.84rem; }
  .pill { font-size:.74rem; font-weight:700; padding:4px 11px; border-radius:999px; }
  .pill.baru { background:var(--red-soft); color:var(--red); }
  .pill.diproses { background:#fff4d6; color:#9a6b00; }
  .pill.siap { background:#e3f0ff; color:#1b5fb0; }
  .pill.selesai { background:#e6f6ea; color:#2d8a4e; }
  .pill.dibatalkan { background:#eee; color:#777; }
  .order-body { display:grid; grid-template-columns:1.4fr 1fr; gap:24px; }
  .order-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .order-actions select { padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-family:inherit; }
  .link-del { background:none; color:var(--gray); font-size:.82rem; text-decoration:underline; margin-left:auto; }
  .empty { text-align:center; color:var(--gray); padding:60px 0; }
  /* login gate */
  .gate { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .gate .panel { width:100%; max-width:360px; }
  .err { color:var(--red); font-size:.85rem; margin-top:10px; display:none; }
  /* tab & kelola menu */
  .tabs { display:flex; gap:8px; margin:24px 0 0; }
  .tab-btn { background:var(--white); border:1px solid var(--border); border-radius:999px; padding:9px 20px; font-family:inherit; font-weight:600; font-size:.9rem; color:var(--gray); cursor:pointer; }
  .tab-btn.active { background:var(--red); border-color:var(--red); color:#fff; }
  .menu-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:24px 0 14px; }
  .menu-row { display:flex; align-items:center; gap:16px; padding:14px 18px; }
  .menu-thumb { width:64px; height:64px; border-radius:10px; overflow:hidden; background:var(--cream); display:grid; place-items:center; font-size:1.8rem; flex-shrink:0; }
  .menu-thumb img { width:100%; height:100%; object-fit:cover; }
  .menu-info { flex:1; min-width:0; }
  .menu-info strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .menu-actions { display:flex; gap:10px; align-items:center; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; overflow:auto; }
  .modal-card { background:var(--white); border-radius:var(--radius-md); width:100%; max-width:460px; padding:24px; max-height:calc(100vh - 32px); overflow:auto; }
  .modal-card h3 { margin-bottom:14px; }
  .modal-card .field { margin-bottom:14px; }
  .modal-card label { display:block; font-size:.85rem; font-weight:600; margin-bottom:6px; }
  .modal-card input[type=text], .modal-card input[type=number], .modal-card select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:.92rem; background:var(--white); }
  .modal-card .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .img-preview { display:flex; align-items:center; gap:12px; margin-top:8px; }
  .modal-btns { display:flex; gap:10px; margin-top:18px; }
  .modal-btns .btn { flex:1; }
  @media (max-width:860px) { .stats { grid-template-columns:repeat(2,1fr); } .order-body { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- DASHBOARD -->
<div id="dash">
  <header class="adm-top">
    <div class="wrap">
      <a href="admin.html" class="logo"><span class="bowl">🍜</span> Mie Ayam Gendok <span class="adm-badge">ADMIN</span></a>
      <div style="display:flex; gap:10px;">
        <a href="index.html" class="btn btn-outline btn-sm">Lihat Website</a>
        <button class="btn btn-red btn-sm" id="logout" type="button">Keluar</button>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-bottom:80px;">
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="orders">Pesanan</button>
      <button type="button" class="tab-btn" data-tab="menu">Kelola Menu</button>
    </div>

    <div id="tab-orders">
    <div class="stats">
      <div class="stat alert"><div class="label">Menunggu</div><div class="value" id="st-baru">0</div></div>
      <div class="stat"><div class="label">Sedang Diproses</div><div class="value" id="st-proses">0</div></div>
      <div class="stat"><div class="label">Total Pesanan <span style="font-size:.72rem;">(semua status)</span></div><div class="value" id="st-total">0</div></div>
      <div class="stat"><div class="label">Pendapatan (selesai)</div><div class="value" id="st-income">Rp0</div></div>
    </div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Cari nama pelanggan, no. WhatsApp, atau ID pesanan...">
      <select id="f-status">
        <option value="all">Semua status</option>
        <option value="baru">Menunggu</option>
        <option value="diproses">Diproses</option>
        <option value="siap">Siap</option>
        <option value="selesai">Selesai</option>
        <option value="dibatalkan">Dibatalkan</option>
      </select>
    </div>

    <p id="src-info" class="order-meta" style="margin:-6px 0 16px;"></p>
    <p id="load-err" class="order-meta" style="display:none; color:var(--red); margin-bottom:12px;"></p>
    <div id="list"></div>
    </div>

    <div id="tab-menu" style="display:none;">
      <div class="menu-bar">
        <div>
          <h2 style="margin:0;">Daftar Menu</h2>
          <p id="menu-src" class="order-meta" style="margin-top:4px;"></p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button type="button" class="link-del" id="menu-reset" style="margin-left:0;">Kembalikan menu awal</button>
          <button type="button" class="btn btn-yellow btn-sm" id="menu-add">+ Tambah Menu</button>
        </div>
      </div>
      <p id="menu-err" class="order-meta" style="display:none; color:var(--red); margin-bottom:12px;"></p>
      <div id="menu-list"></div>
    </div>
  </main>

  <!-- Form tambah / edit menu -->
  <div class="modal" id="menu-modal" role="dialog" aria-modal="true" aria-labelledby="mm-title">
    <form class="modal-card" id="menu-form" novalidate>
      <h3 id="mm-title">Tambah Menu</h3>
      <p class="err" id="mm-err" role="alert"></p>
      <div class="field">
        <label for="mm-name">Nama Menu</label>
        <input id="mm-name" type="text" maxlength="80" placeholder="Contoh: Mie Ayam Spesial">
      </div>
      <div class="row2">
        <div class="field">
          <label for="mm-price">Harga (Rp)</label>
          <input id="mm-price" type="number" min="0" step="500" placeholder="12000">
        </div>
        <div class="field">
          <label for="mm-rating">Rating (opsional)</label>
          <input id="mm-rating" type="number" min="0" max="5" step="0.1" placeholder="4.5">
        </div>
      </div>
      <div class="field">
        <label for="mm-cat">Kategori</label>
        <select id="mm-cat"></select>
      </div>
      <div class="field">
        <label for="mm-image">Gambar (JPG/PNG/WebP)</label>
        <input id="mm-image" type="file" accept="image/jpeg,image/png,image/webp">
        <div class="img-preview" id="mm-preview-wrap" style="display:none;">
          <div class="menu-thumb"><img id="mm-preview" alt="Pratinjau"></div>
          <button type="button" class="link-del" id="mm-clear-img" style="margin-left:0;">Hapus gambar</button>
        </div>
      </div>
      <label style="display:flex; gap:8px; align-items:center; font-weight:500;">
        <input id="mm-avail" type="checkbox" checked> Tersedia (tampil di menu pelanggan)
      </label>
      <div class="modal-btns">
        <button type="button" class="btn btn-outline" id="mm-cancel">Batal</button>
        <button type="submit" class="btn btn-yellow" id="mm-save">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/cart.js"></script>
<script>
  const STATUS = { baru:'Menunggu', diproses:'Diproses', siap:'Siap', selesai:'Selesai', dibatalkan:'Dibatalkan' };
  const PAY = { tunai:'Tunai', qris:'QRIS', transfer:'Bank Transfer' };
  const DLV = { ambil:'Ambil Sendiri', kurir:'Kurir' };

  let orders = [];
  let lastSig = null;

  const st = (o) => (STATUS[o.status] ? o.status : 'baru');
  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  $('logout').addEventListener('click', () => Auth.logout());

  // Ambil data terbaru dari sumber yang sama dengan checkout pelanggan (Orders di cart.js)
  async function load(force) {
    try {
      const list = await Orders.all();
      $('load-err').style.display = 'none';
      const sig = JSON.stringify(list);
      if (force || sig !== lastSig) { lastSig = sig; orders = list; render(); }
    } catch (err) {
      $('load-err').textContent = 'Gagal memuat pesanan: ' + err.message;
      $('load-err').style.display = 'block';
    }
  }

  function render() {
    const all = orders;
    const q = $('q').value.trim().toLowerCase();
    const fs = $('f-status').value;

    // statistik (selalu dari SEMUA pesanan, tidak terpengaruh filter)
    $('st-baru').textContent = all.filter((o) => st(o) === 'baru').length;
    $('st-proses').textContent = all.filter((o) => st(o) === 'diproses').length;
    $('st-total').textContent = all.length;
    $('st-income').textContent = formatRupiah(
      all.filter((o) => st(o) === 'selesai').reduce((s, o) => s + (Number(o.total) || 0), 0)
    );

    const rows = all.filter((o) => {
      if (fs !== 'all' && st(o) !== fs) return false;
      if (!q) return true;
      const c = o.customer || {};
      return [o.id, c.name, c.wa].join(' ').toLowerCase().includes(q);
    });

    const list = $('list');
    if (all.length === 0) {
      list.innerHTML = '<div class="empty"><p style="font-size:2.2rem;">🧾</p><p>Belum ada pesanan</p></div>';
      return;
    }
    if (rows.length === 0) {
      list.innerHTML = '<div class="empty"><p style="font-size:2.2rem;">🔍</p><p>Tidak ada pesanan yang cocok dengan pencarian/filter.</p></div>';
      return;
    }

    list.innerHTML = rows.map((o) => {
      const c = o.customer || {};
      const s = st(o);
      const waNum = (c.wa || '').replace(/\D/g, '').replace(/^0/, '62');
      return `
      <div class="order-card ${s}">
        <div class="order-head">
          <div><strong>#${esc(o.id)}</strong> <span class="order-meta">&middot; ${esc(o.date)}</span></div>
          <span class="pill ${s}">${STATUS[s]}</span>
        </div>
        <div class="order-body">
          <div>
            ${(o.items || []).map((it) => `
              <div class="summary-item" style="padding:6px 0;">
                <div><div class="name">${esc(it.name)}</div><div class="sub">${it.qty} x ${formatRupiah(it.price)}</div></div>
                <div>${formatRupiah(it.qty * it.price)}</div>
              </div>`).join('')}
            <div class="summary-total"><span>Total</span><span class="amount">${formatRupiah(o.total)}</span></div>
          </div>
          <div style="font-size:.9rem; line-height:1.8;">
            <div><strong>${esc(c.name || '-')}</strong></div>
            <div class="order-meta">WhatsApp: ${esc(c.wa || '-')}</div>
            <div class="order-meta">Pengiriman: ${DLV[o.delivery] || esc(o.delivery)}</div>
            ${c.address ? `<div class="order-meta">Alamat: ${esc(c.address)}</div>` : ''}
            <div class="order-meta">Pembayaran: ${PAY[o.payment] || esc(o.payment)}</div>
            ${c.note ? `<div style="margin-top:6px; background:var(--cream); padding:8px 10px; border-radius:8px;">📝 ${esc(c.note)}</div>` : ''}
          </div>
        </div>
        <div class="order-actions">
          <select data-status="${esc(o.id)}">
            ${Object.keys(STATUS).map((k) => `<option value="${k}" ${k === s ? 'selected' : ''}>${STATUS[k]}</option>`).join('')}
          </select>
          ${waNum ? `<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://wa.me/${waNum}?text=${encodeURIComponent('Halo ' + (c.name || '') + ', pesanan #' + o.id + ' di Mie Ayam Gendok sedang kami proses.')}">Chat WhatsApp</a>` : ''}
          <button type="button" class="link-del" data-del="${esc(o.id)}">Hapus</button>
        </div>
      </div>`;
    }).join('');
  }

  document.addEventListener('change', async (e) => {
    const sel = e.target.closest('[data-status]');
    if (!sel) return;
    try { await Orders.setStatus(sel.dataset.status, sel.value); }
    catch (err) { alert('Gagal mengubah status: ' + err.message); }
    load(true);
  });

  document.addEventListener('click', async (e) => {
    const del = e.target.closest('[data-del]');
    if (!del) return;
    if (!confirm('Hapus pesanan ini?')) return;
    try { await Orders.remove(del.dataset.del); }
    catch (err) { alert('Gagal menghapus: ' + err.message); }
    load(true);
  });

  $('q').addEventListener('input', render);
  $('f-status').addEventListener('change', render);

  // Sinkronisasi: kembali ke tab ini, jendela difokuskan, halaman dari cache, dan polling berkala
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  window.addEventListener('focus', () => load());
  window.addEventListener('pageshow', () => load());
  setInterval(load, 5000);

  $('src-info').textContent = 'Sumber data: server (data/orders.json) — pesanan dari semua pelanggan tampil di sini dan diperbarui otomatis.';

  load(true);

  // ================= KELOLA MENU =================
  const mEsc = esc;
  let menu = [];
  let editingId = null;
  let formImage = '';

  function showTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
    $('tab-orders').style.display = name === 'orders' ? '' : 'none';
    $('tab-menu').style.display = name === 'menu' ? '' : 'none';
    history.replaceState(null, '', name === 'menu' ? '#menu' : location.pathname);
    if (name === 'menu') loadMenu();
  }
  document.querySelectorAll('.tab-btn').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

  async function loadMenu() {
    try {
      menu = await Menu.list();
      $('menu-err').style.display = 'none';
      renderMenu();
    } catch (err) {
      $('menu-err').textContent = 'Gagal memuat menu: ' + err.message;
      $('menu-err').style.display = 'block';
    }
  }

  function renderMenu() {
    const box = $('menu-list');
    if (menu.length === 0) {
      box.innerHTML = '<div class="empty"><p style="font-size:2.2rem;">🍜</p><p>Belum ada menu. Klik "+ Tambah Menu".</p></div>';
      return;
    }
    box.innerHTML = menu.map((m) => `
      <div class="order-card menu-row">
        <div class="menu-thumb">${m.image ? `<img src="${mEsc(m.image)}" alt="">` : '🍜'}</div>
        <div class="menu-info">
          <strong>${mEsc(m.name)}</strong>
          <div class="order-meta">${mEsc(MENU_CATEGORIES[m.category] || m.category)} &middot; ${formatRupiah(m.price)}${Number(m.rating) > 0 ? ' &middot; ★ ' + Number(m.rating).toFixed(1) : ''}</div>
          ${m.available === false ? '<span class="pill dibatalkan" style="display:inline-block; margin-top:6px;">Tidak tersedia</span>' : ''}
        </div>
        <div class="menu-actions">
          <button type="button" class="btn btn-outline btn-sm" data-edit="${mEsc(m.id)}">Edit</button>
          <button type="button" class="link-del" data-mdel="${mEsc(m.id)}" style="margin-left:0;">Hapus</button>
        </div>
      </div>`).join('');
  }

  async function saveMenu(list, okMsg) {
    try { await Menu.save(list); menu = list; renderMenu(); return true; }
    catch (err) { alert('Gagal menyimpan menu: ' + err.message); loadMenu(); return false; }
  }

  // ---- Modal ----
  function setPreview(src) {
    formImage = src || '';
    $('mm-preview').src = formImage;
    $('mm-preview-wrap').style.display = formImage ? 'flex' : 'none';
  }
  function modalError(msg) { const e = $('mm-err'); e.textContent = msg || ''; e.style.display = msg ? 'block' : 'none'; }
  function openModal(item) {
    editingId = item ? item.id : null;
    $('mm-title').textContent = item ? 'Edit Menu' : 'Tambah Menu';
    $('mm-cat').innerHTML = Object.keys(MENU_CATEGORIES).map((k) => `<option value="${k}">${mEsc(MENU_CATEGORIES[k])}</option>`).join('');
    $('mm-name').value = item ? item.name : '';
    $('mm-price').value = item ? item.price : '';
    $('mm-rating').value = item && item.rating != null ? item.rating : '';
    $('mm-cat').value = item ? item.category : Object.keys(MENU_CATEGORIES)[0];
    $('mm-avail').checked = item ? item.available !== false : true;
    $('mm-image').value = '';
    setPreview(item ? item.image : '');
    modalError('');
    $('menu-modal').style.display = 'flex';
    $('mm-name').focus();
  }
  function closeModal() { $('menu-modal').style.display = 'none'; }

  // Gambar diperkecil (maks. 600px) dan dijadikan JPEG agar ringan
  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return reject(new Error('Format gambar harus JPG, PNG, atau WebP.'));
      if (file.size > 8 * 1024 * 1024) return reject(new Error('Ukuran gambar maksimal 8 MB.'));
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('Gagal membaca file.'));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('File bukan gambar yang valid.'));
        img.onload = () => {
          const scale = Math.min(1, 600 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  $('mm-image').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try { modalError(''); setPreview(await fileToDataURL(f)); }
    catch (err) { e.target.value = ''; modalError(err.message); }
  });
  $('mm-clear-img').addEventListener('click', () => { $('mm-image').value = ''; setPreview(''); });
  $('mm-cancel').addEventListener('click', closeModal);
  $('menu-modal').addEventListener('click', (e) => { if (e.target === $('menu-modal')) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  $('menu-add').addEventListener('click', () => openModal(null));

  function slugId(name) {
    const base = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'menu';
    let id;
    do { id = base + '-' + Math.random().toString(36).slice(2, 6); } while (menu.some((m) => m.id === id));
    return id;
  }

  $('menu-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('mm-name').value.trim();
    const priceRaw = $('mm-price').value.trim();
    const price = Number(priceRaw);
    const ratingRaw = $('mm-rating').value.trim();
    const rating = ratingRaw === '' ? null : Number(ratingRaw);

    if (name.length < 2) return modalError('Nama menu minimal 2 karakter.');
    if (priceRaw === '' || !Number.isInteger(price) || price < 0 || price > 10000000) return modalError('Harga harus berupa angka bulat (Rp), 0 – 10.000.000.');
    if (rating !== null && !(rating >= 0 && rating <= 5)) return modalError('Rating harus antara 0 sampai 5.');
    if (menu.some((m) => m.id !== editingId && m.name.toLowerCase() === name.toLowerCase())) return modalError('Sudah ada menu dengan nama yang sama.');

    const item = {
      id: editingId || slugId(name), name, price, category: $('mm-cat').value,
      rating, image: formImage, available: $('mm-avail').checked
    };
    const next = editingId ? menu.map((m) => (m.id === editingId ? item : m)) : menu.concat(item);

    $('mm-save').disabled = true;
    const ok = await saveMenu(next);
    $('mm-save').disabled = false;
    if (ok) closeModal();
  });

  document.addEventListener('click', async (e) => {
    const ed = e.target.closest('[data-edit]');
    if (ed) { const m = menu.find((x) => x.id === ed.dataset.edit); if (m) openModal(m); return; }
    const del = e.target.closest('[data-mdel]');
    if (del) {
      const m = menu.find((x) => x.id === del.dataset.mdel);
      if (m && confirm('Hapus menu "' + m.name + '"? Pesanan yang sudah masuk tidak terpengaruh.')) {
        await saveMenu(menu.filter((x) => x.id !== m.id));
      }
    }
  });

  $('menu-reset').addEventListener('click', async () => {
    if (!confirm('Kembalikan daftar menu ke menu awal? Menu yang kamu tambah/ubah akan hilang.')) return;
    try { await Menu.reset(); } catch (err) { alert('Gagal: ' + err.message); }
    loadMenu();
  });


  $('menu-src').textContent = 'Perubahan langsung tampil di semua perangkat pelanggan.';

  if (location.hash === '#menu') showTab('menu');
</script>
</body>
</html>
