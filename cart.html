<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang — Mie Ayam Gendok</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/auth.js" data-guard="customer"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><span class="bowl">🍜</span> Mie Ayam Gendok</a>
    <nav class="main-nav">
      <a href="index.html">Beranda</a>
      <a href="menu.html">Menu</a>
      <a href="orders.html">Pesanan Saya</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn-outline btn btn-sm">Login</a>
      <a href="cart.html" class="cart-btn" aria-label="Keranjang">
        🛒 <span class="cart-count" data-cart-count>0</span>
      </a>
    </div>
  </div>
</header>

<section class="checkout-page">
  <div class="wrap" style="grid-template-columns: 1fr; max-width: 720px;">
    <div class="panel">
      <h2>Keranjang Belanja</h2>
      <div id="cart-list"></div>

      <div id="cart-empty" style="display:none; text-align:center; padding: 30px 0; color: var(--gray);">
        <p style="font-size:2.2rem; margin-bottom:10px;">🛒</p>
        <p>Keranjangmu masih kosong.</p>
        <a href="menu.html" class="btn btn-red" style="margin-top:16px;">Lihat Menu</a>
      </div>

      <div id="cart-footer">
        <div class="summary-total">
          <span>Total</span>
          <span class="amount" id="cart-total">Rp0</span>
        </div>
        <a href="checkout.html" class="btn btn-yellow btn-block" style="margin-top:16px;">Lanjut ke Checkout →</a>
      </div>
    </div>
  </div>
</section>

<script src="assets/js/cart.js"></script>
<script>
  function renderCartPage() {
    const cart = getCart();
    const list = document.getElementById('cart-list');
    const empty = document.getElementById('cart-empty');
    const footer = document.getElementById('cart-footer');

    if (cart.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      footer.style.display = 'none';
      return;
    }

    empty.style.display = 'none';
    footer.style.display = 'block';

    list.innerHTML = cart.map((item) => `
      <div class="summary-item" style="align-items:center; border-bottom:1px solid var(--border); padding:14px 0;">
        <div>
          <div class="name">${item.name}</div>
          <div class="sub">${formatRupiah(item.price)} / porsi</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="display:flex; align-items:center; border:1px solid var(--border); border-radius:8px;">
            <button type="button" class="qty-btn" data-action="dec" data-id="${item.id}" style="background:none; padding:6px 12px; font-weight:700;">−</button>
            <span style="min-width:22px; text-align:center;">${item.qty}</span>
            <button type="button" class="qty-btn" data-action="inc" data-id="${item.id}" style="background:none; padding:6px 12px; font-weight:700;">+</button>
          </div>
          <strong style="min-width:90px; text-align:right;">${formatRupiah(item.qty * item.price)}</strong>
          <button type="button" data-action="remove" data-id="${item.id}" style="background:none; color:var(--red); font-size:1.1rem;" aria-label="Hapus">✕</button>
        </div>
      </div>
    `).join('');

    document.getElementById('cart-total').textContent = formatRupiah(cartTotal());
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const cart = getCart();
    const item = cart.find((i) => i.id === id);
    if (!item) return;

    if (btn.dataset.action === 'inc') updateQty(id, item.qty + 1);
    if (btn.dataset.action === 'dec') updateQty(id, item.qty - 1);
    if (btn.dataset.action === 'remove') removeFromCart(id);

    renderCartPage();
  });

  document.addEventListener('DOMContentLoaded', renderCartPage);
</script>
</body>
</html>
